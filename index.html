<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1D9E75">
<title>スービック ゴルフナビ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: #0f1410; color: #e8ede9; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header { background: #0F6E56; padding: 8px 12px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  header h1 { font-size: 14px; font-weight: 600; color: #fff; }
  header .ver { font-size: 10px; font-weight: 400; opacity: 0.7; background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 8px; }
  #compass { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  #compass-dial { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); position: relative; background: rgba(0,0,0,0.25); }
  #compass-needle { position: absolute; top: 50%; left: 50%; width: 2px; height: 15px; background: #FF5A4A; transform-origin: bottom center; transform: translate(-50%, -100%) rotate(0deg); transition: transform 0.15s; }
  #compass-needle::after { content: ''; position: absolute; top: -3px; left: 50%; transform: translateX(-50%); border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 6px solid #FF5A4A; }
  #compass-txt { font-size: 11px; color: #fff; min-width: 64px; line-height: 1.2; }
  #compass-txt b { font-size: 13px; }
  #enable-compass { font-size: 10px; padding: 4px 8px; background: rgba(255,255,255,0.2); color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  .toolbar { display: flex; gap: 6px; padding: 7px 10px; background: #1a211c; flex-shrink: 0; overflow-x: auto; align-items: center; }
  .tb-btn { padding: 6px 11px; border-radius: 8px; border: 1px solid #2e372f; background: #232b25; color: #9db0a3; font-size: 12px; white-space: nowrap; cursor: pointer; }
  .tb-btn.active { background: #1D9E75; color: #fff; border-color: #1D9E75; font-weight: 600; }
  .tb-sep { width: 1px; height: 22px; background: #2e372f; margin: 0 2px; flex-shrink: 0; }
  .mode-par.active { background: #EF9F27; border-color: #EF9F27; color: #3a2600; }
  .mode-bogey.active { background: #378ADD; border-color: #378ADD; color: #fff; }
  .edit-row { display: flex; gap: 6px; padding: 6px 10px; background: #141a16; flex-shrink: 0; overflow-x: auto; align-items: center; border-top: 1px solid #2e372f; }
  .edit-row .hint { font-size: 11px; color: #9db0a3; white-space: nowrap; }
  #map { flex: 1; width: 100%; }
  #seg-info { padding: 8px 14px; background: #1a211c; border-top: 1px solid #2e372f; flex-shrink: 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 13px; }
  #seg-info .label { color: #9db0a3; }
  #seg-info .segs { color: #e8ede9; font-weight: 600; }
  #seg-info .total { margin-left: auto; }
  #seg-info .total b { color: #6ee8b0; font-size: 17px; }
  .mk { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,.5); font-size: 11px; font-weight: 700; color: #fff; cursor: pointer; }
  .mk.tee { background: #1D9E75; border-radius: 6px; }
  .mk.shot-par { background: #EF9F27; }
  .mk.shot-bogey { background: #378ADD; }
  .mk.green { background: #D85A30; border-radius: 50%; }
  .mk.green span { display: block; }
  .mk.selected { border-color: #FFD700; border-width: 3.5px; filter: brightness(1.25); }
  .seg-label { background: rgba(0,0,0,0.7); color: #fff; font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 10px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.3); }
  #toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: rgba(15,110,86,0.96); color: #fff; padding: 9px 18px; border-radius: 22px; font-size: 13px; z-index: 1000; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>⛳ <span id="hole-title">1番ホール</span> <span class="ver">v3.1</span></h1>
    <div id="compass">
      <div id="compass-dial"><div id="compass-needle"></div></div>
      <div id="compass-txt"><button id="enable-compass" onclick="enableCompass()">方角ON</button></div>
    </div>
  </header>
  <div style="background:#141a16; padding:5px 10px; flex-shrink:0;">
    <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;">
      <span style="font-size:10px;color:#9db0a3;white-space:nowrap;margin-right:2px;">OUT:</span>
      <button class="tb-btn active" id="hbtn-1" onclick="switchHole(1)">1</button>
      <button class="tb-btn" id="hbtn-2" onclick="switchHole(2)">2</button>
      <button class="tb-btn" id="hbtn-3" onclick="switchHole(3)">3</button>
      <button class="tb-btn" id="hbtn-4" onclick="switchHole(4)">4</button>
      <button class="tb-btn" id="hbtn-5" onclick="switchHole(5)">5</button>
      <button class="tb-btn" id="hbtn-6" onclick="switchHole(6)">6</button>
      <button class="tb-btn" id="hbtn-7" onclick="switchHole(7)">7</button>
      <button class="tb-btn" id="hbtn-8" onclick="switchHole(8)">8</button>
      <button class="tb-btn" id="hbtn-9" onclick="switchHole(9)">9</button>
      <span style="font-size:10px;color:#9db0a3;white-space:nowrap;margin-left:4px;margin-right:2px;">IN:</span>
      <button class="tb-btn" id="hbtn-10" onclick="switchHole(10)">10</button>
      <button class="tb-btn" id="hbtn-11" onclick="switchHole(11)">11</button>
      <button class="tb-btn" id="hbtn-12" onclick="switchHole(12)">12</button>
      <button class="tb-btn" id="hbtn-13" onclick="switchHole(13)">13</button>
      <button class="tb-btn" id="hbtn-14" onclick="switchHole(14)">14</button>
      <button class="tb-btn" id="hbtn-15" onclick="switchHole(15)">15</button>
      <button class="tb-btn" id="hbtn-16" onclick="switchHole(16)">16</button>
      <button class="tb-btn" id="hbtn-17" onclick="switchHole(17)">17</button>
      <button class="tb-btn" id="hbtn-18" onclick="switchHole(18)">18</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="tb-btn mode-par active" id="b-par" onclick="setMode('par')">パーオン</button>
    <button class="tb-btn mode-bogey" id="b-bogey" onclick="setMode('bogey')">ボギーオン</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="b-view" onclick="toggleView()">プレーヤー目線</button>
    <button class="tb-btn" id="b-gps" onclick="toggleGPS()">📍 現在地</button>
    <div class="tb-sep"></div>
    <button class="tb-btn active" id="b-unit" onclick="toggleUnit()">yd / m</button>
  </div>
  <div style="background:#0d1510; padding:5px 10px; flex-shrink:0; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
    <span style="font-size:11px;color:#9db0a3;">ティー:</span>
    <button class="tb-btn" id="tbtn-gold" onclick="setTee('gold')" style="background:#DAA520;border-color:#DAA520;color:#3a2600;font-weight:700;">Gold</button>
    <button class="tb-btn active" id="tbtn-blue" onclick="setTee('blue')" style="">Blue</button>
    <button class="tb-btn" id="tbtn-white" onclick="setTee('white')">White</button>
    <button class="tb-btn" id="tbtn-red" onclick="setTee('red')" style="color:#D04040;">Red</button>
    <div style="margin-left:10px;background:rgba(0,0,0,0.3);padding:4px 12px;border-radius:12px;display:flex;gap:14px;align-items:center;">
      <span style="font-size:13px;color:#9db0a3;">Par <b id="tee-par" style="color:#6ee8b0;font-size:15px;">4</b></span>
      <span style="font-size:13px;color:#9db0a3;">Hdcp <b id="tee-hcp" style="color:#e8ede9;">11</b></span>
      <span style="font-size:13px;color:#9db0a3;"><b id="tee-dist" style="color:#FFD700;font-size:16px;">395</b> yd</span>
    </div>
  </div>
  <div class="edit-row">
    <span class="hint" id="edit-hint">マーカーをタップ→移動先をタップで調整</span>
    <button class="tb-btn" onclick="addMidpoint()">＋落としどころ追加</button>
    <button class="tb-btn" onclick="deleteSelected()">選択を削除</button>
    <button class="tb-btn" onclick="resetLine()">初期位置に戻す</button>
  </div>
  <div id="map"></div>
  <div id="seg-info">
    <span class="label">各区間:</span>
    <span class="segs" id="seg-text">-</span>
    <span style="color:#9db0a3;font-size:12px;">合計 <b id="sum-text" style="color:#e8ede9;">-</b></span>
    <span class="total">グリーンまで <b id="total-text">395</b> <span id="unit-label">yd</span></span>
  </div>
  <div id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<script>
var HOLES_DATA = {
  1:  { n:1,  par:4, blue:395, gold:429, white:370, red:325, gold_par:4, hcp:11, label:'1番 Par4 395y',  center:[14.8138,120.3179],
    init:{ par:[[14.814731,120.316676],[14.812693,120.319251]], bogey:[[14.814731,120.316676],[14.812693,120.319251]] }},
  2:  { n:2,  par:4, blue:403, gold:458, white:378, red:294, gold_par:4, hcp:1,  label:'2番 Par4 403y ★最難関', center:[14.8108,120.3197],
    init:{ par:[[14.811835,120.318792],[14.809783,120.320667]], bogey:[[14.811835,120.318792],[14.809783,120.320667]] }},
  3:  { n:3,  par:4, blue:367, gold:397, white:347, red:306, gold_par:4, hcp:5,  label:'3番 Par4 367y',  center:[14.8093,120.3222],
    init:{ par:[[14.809334,120.320849],[14.809327,120.323591]], bogey:[[14.809334,120.320849],[14.809327,120.323591]] }},
  4:  { n:4,  par:4, blue:310, gold:328, white:299, red:280, gold_par:4, hcp:17, label:'4番 Par4 310y',  center:[14.8105,120.3234],
    init:{ par:[[14.809657,120.324111],[14.811261,120.322609]], bogey:[[14.809657,120.324111],[14.811261,120.322609]] }},
  5:  { n:5,  par:5, blue:559, gold:585, white:518, red:468, gold_par:5, hcp:3,  label:'5番 Par5 559y',  center:[14.8130,120.3201],
    init:{ par:[[14.811637,120.321981],[14.814280,120.318156]], bogey:[[14.811637,120.321981],[14.814280,120.318156]] }},
  6:  { n:6,  par:3, blue:194, gold:242, white:169, red:135, gold_par:3, hcp:7,  label:'6番 Par3 194y',  center:[14.8123,120.3191],
    init:{ par:[[14.812271,120.319691],[14.812330,120.318543]], bogey:[[14.812271,120.319691],[14.812330,120.318543]] }},
  7:  { n:7,  par:5, blue:478, gold:534, white:468, red:427, gold_par:5, hcp:15, label:'7番 Par5 478y',  center:[14.8127,120.3161],
    init:{ par:[[14.812499,120.318068],[14.812973,120.314176]], bogey:[[14.812499,120.318068],[14.812973,120.314176]] }},
  8:  { n:8,  par:3, blue:179, gold:218, white:154, red:135, gold_par:3, hcp:9,  label:'8番 Par3 179y',  center:[14.8140,120.3130],
    init:{ par:[[14.813337,120.313468],[14.814601,120.312647]], bogey:[[14.813337,120.313468],[14.814601,120.312647]] }},
  9:  { n:9,  par:4, blue:343, gold:366, white:323, red:278, gold_par:4, hcp:13, label:'9番 Par4 343y',  center:[14.8153,120.3138],
    init:{ par:[[14.814935,120.312781],[14.815706,120.314847]], bogey:[[14.814935,120.312781],[14.815706,120.314847]] }},
  10: { n:10, par:4, blue:382, gold:410, white:340, red:303, gold_par:4, hcp:14, label:'10番 Par4 382y', center:[14.8159,120.3130],
    init:{ par:[[14.816202,120.314361],[14.815540,120.311628]], bogey:[[14.816202,120.314361],[14.815540,120.311628]] }},
  11: { n:11, par:4, blue:389, gold:426, white:364, red:270, gold_par:4, hcp:2,  label:'11番 Par4 389y ★難関', center:[14.8134,120.3111],
    init:{ par:[[14.814587,120.311607],[14.812268,120.310550]], bogey:[[14.814587,120.311607],[14.812268,120.310550]] }},
  12: { n:12, par:4, blue:430, gold:460, white:392, red:303, gold_par:4, hcp:8,  label:'12番 Par4 430y', center:[14.8130,120.3081],
    init:{ par:[[14.812051,120.309171],[14.813834,120.307154]], bogey:[[14.812051,120.309171],[14.813834,120.307154]] }},
  13: { n:13, par:5, blue:530, gold:530, white:460, red:406, gold_par:5, hcp:6,  label:'13番 Par5 530y', center:[14.8147,120.3093],
    init:{ par:[[14.814441,120.307505],[14.814907,120.311118]], bogey:[[14.814441,120.307505],[14.814907,120.311118]] }},
  14: { n:14, par:5, blue:446, gold:446, white:422, red:404, gold_par:4, hcp:16, label:'14番 Par5 446y', center:[14.8153,120.3090],
    init:{ par:[[14.815452,120.310448],[14.815146,120.307460]], bogey:[[14.815452,120.310448],[14.815146,120.307460]] }},
  15: { n:15, par:3, blue:154, gold:154, white:143, red:122, gold_par:3, hcp:10, label:'15番 Par3 154y', center:[14.8165,120.3096],
    init:{ par:[[14.815971,120.309850],[14.817039,120.309278]], bogey:[[14.815971,120.309850],[14.817039,120.309278]] }},
  16: { n:16, par:4, blue:416, gold:428, white:392, red:284, gold_par:4, hcp:4,  label:'16番 Par4 416y ★難関', center:[14.8175,120.3118],
    init:{ par:[[14.817921,120.310394],[14.817008,120.313237]], bogey:[[14.817921,120.310394],[14.817008,120.313237]] }},
  17: { n:17, par:3, blue:162, gold:211, white:147, red:118, gold_par:3, hcp:18, label:'17番 Par3 162y', center:[14.8170,120.3117],
    init:{ par:[[14.816853,120.312264],[14.817148,120.311129]], bogey:[[14.816853,120.312264],[14.817148,120.311129]] }},
  18: { n:18, par:4, blue:368, gold:422, white:348, red:322, gold_par:4, hcp:12, label:'18番 Par4 368y', center:[14.8164,120.3125],
    init:{ par:[[14.816201,120.311113],[14.816645,120.313801]], bogey:[[14.816201,120.311113],[14.816645,120.313801]] }}
};
var currentHole=1;
function holeData(){ return HOLES_DATA[currentHole]; }
var workLines={};
Object.keys(HOLES_DATA).forEach(function(n){ workLines[n]={ par:JSON.parse(JSON.stringify(HOLES_DATA[n].init.par)), bogey:JSON.parse(JSON.stringify(HOLES_DATA[n].init.bogey)) }; });

var map = L.map('map', { zoomControl:true, attributionControl:true, rotate:true, rotateControl:false, touchRotate:false, bearing:0 }).setView([14.8138,120.3179],17);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution:'Tiles © Esri', maxZoom:19 }).addTo(map);

var mode='par', rotated=false, selectedIdx=null, selectedTee='blue';
var unit='yd'; // 'yd' or 'm'
var segLabelLayer=L.layerGroup().addTo(map);
function toDisplay(meters){ return unit==='yd' ? Math.round(meters*1.09361) : Math.round(meters); }
var markerLayer=L.layerGroup().addTo(map);
var lineLayer=L.layerGroup().addTo(map);
var markers=[];
var gpsWatchId=null, gpsMarker=null, gpsAccuracy=null, gpsActive=false;

function cur(){ return workLines[currentHole][mode]; }
function dist(a,b){ return L.latLng(a).distanceTo(L.latLng(b)); }
function bearing(a,b){ var la1=a[0]*Math.PI/180,la2=b[0]*Math.PI/180,dL=(b[1]-a[1])*Math.PI/180; var y=Math.sin(dL)*Math.cos(la2),x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dL); return (Math.atan2(y,x)*180/Math.PI+360)%360; }

function shotClass(){ return mode==='par'?'shot-par':'shot-bogey'; }


function setTee(t){
  selectedTee=t;
  ['gold','blue','white','red'].forEach(function(c){
    var b=document.getElementById('tbtn-'+c);
    if(!b)return;
    b.classList.toggle('active',c===t);
    if(c==='gold'){ b.style.background=t==='gold'?'#DAA520':''; b.style.borderColor=t==='gold'?'#DAA520':''; b.style.color=t==='gold'?'#3a2600':''; }
    if(c==='red'){ b.style.color=t!=='red'?'#D04040':''; }
  });
  updateTeeInfo();
}

function updateTeeInfo(){
  var h=holeData();
  var dist = selectedTee==='gold'?h.gold: selectedTee==='white'?h.white: selectedTee==='red'?h.red: h.blue;
  var par  = selectedTee==='gold'?h.gold_par: h.par;
  document.getElementById('tee-par').textContent  = par;
  document.getElementById('tee-hcp').textContent  = h.hcp;
  document.getElementById('tee-dist').textContent = dist;
  document.getElementById('total-text').textContent = gpsActive ? document.getElementById('total-text').textContent : dist;
}

function switchHole(n){
  currentHole=n; selectedIdx=null; rotated=false;
  map.setBearing && map.setBearing(0);
  document.getElementById('b-view').classList.remove('active');
  document.getElementById('b-view').textContent='プレーヤー目線';
  // ホール選択ボタンの状態
  Object.keys(HOLES_DATA).forEach(function(k){
    var b=document.getElementById('hbtn-'+k);
    if(b) b.classList.toggle('active', parseInt(k)===n);
  });
  document.getElementById('hole-title').textContent = holeData().label;
  updateTeeInfo();
  var h=holeData();
  draw();
  map.fitBounds(L.latLngBounds(cur()),{padding:[70,70]});
}
function draw(){
  markerLayer.clearLayers(); lineLayer.clearLayers(); segLabelLayer.clearLayers(); markers=[];
  var pts=cur();
  var color = mode==='par'?'#EF9F27':'#378ADD';
  L.polyline(pts,{color:color,weight:3.5,opacity:0.9}).addTo(lineLayer);

  pts.forEach(function(p,i){
    var cls,label;
    if(i===0){cls='mk tee';label='T';}
    else if(i===pts.length-1){cls='mk green';label='G';}
    else{cls='mk '+shotClass();label=i;}
    if(i===selectedIdx) cls+=' selected';
    var html='<div class="'+cls+'"><span>'+label+'</span></div>';
    var anchor = [14, 14]; // 全マーカー共通：中央基準
    var m=L.marker(p,{icon:L.divIcon({className:'',html:html,iconSize:[28,28],iconAnchor:anchor})}).addTo(markerLayer);
    m.on('click', function(ev){ L.DomEvent.stopPropagation(ev); L.DomEvent.preventDefault(ev); window._mkClick=true; selectMarker(i); });
    markers.push(m);
  });

  // 各区間の距離ラベルを中点に表示
  var segs=[],total=0;
  for(var i=0;i<pts.length-1;i++){
    var meters=dist(pts[i],pts[i+1]);
    var d=toDisplay(meters);
    segs.push(d); total+=meters;
    var midPt=[(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2];
    var lblHtml='<div class="seg-label">'+d+unit+'</div>';
    L.marker(midPt,{icon:L.divIcon({className:'',html:lblHtml,iconSize:[1,1],iconAnchor:[0,0]}),interactive:false}).addTo(segLabelLayer);
  }
  document.getElementById('seg-text').textContent = segs.length?segs.join(' + ')+' '+unit:'-';
  var sumVal = segs.reduce(function(a,b){return a+b;},0);
  document.getElementById('sum-text').textContent = segs.length>1 ? '= '+sumVal+' '+unit : '-';
  document.getElementById('total-text').textContent = toDisplay(total);
  document.getElementById('unit-label').textContent = unit;
}

function toggleUnit(){
  unit = unit==='yd' ? 'm' : 'yd';
  document.getElementById('b-unit').textContent = unit==='yd' ? 'yd / m' : 'm / yd';
  draw();
  if(gpsMarker) updateGpsDistance();
}

function selectMarker(i){
  selectedIdx=i; draw();
  // 選択時は地図を動かさない（向き・位置を維持）
  var role = i===0?'ティー':(i===cur().length-1?'グリーン':i+'打目落下点');
  toast(role+'を選択 → 移動先をタップ');
}

map.on('click', function(e){
  if(window._mkClick){ window._mkClick=false; return; }
  if(selectedIdx===null){ toast('先にマーカーをタップして選択'); return; }
  cur()[selectedIdx]=[e.latlng.lat, e.latlng.lng];
  toast('移動しました');
  selectedIdx=null;
  draw();
  // 回転中でも地図中心は動かさない（向きだけ維持）
  if(rotated){ var pts=cur(); map.setBearing(-bearing(pts[0],pts[pts.length-1])); }
});

function addMidpoint(){
  var pts=cur();
  // 最後の区間の中点に追加（グリーンの手前）
  var i=pts.length-1;
  var mid=[(pts[i-1][0]+pts[i][0])/2, (pts[i-1][1]+pts[i][1])/2];
  pts.splice(i,0,mid);
  toast('落としどころを追加（タップで移動可）');
  draw();
}

function deleteSelected(){
  if(selectedIdx===null){ toast('削除するマーカーを選択してください'); return; }
  if(selectedIdx===0 || selectedIdx===cur().length-1){ toast('ティーとグリーンは削除できません'); return; }
  cur().splice(selectedIdx,1);
  selectedIdx=null; toast('削除しました'); draw();
}

function resetLine(){
  workLines[currentHole][mode]=JSON.parse(JSON.stringify(HOLES_DATA[currentHole].init[mode]));
  selectedIdx=null; toast('初期位置に戻しました'); draw();
  map.fitBounds(L.latLngBounds(cur()),{padding:[70,70]});
}

function setMode(m){
  mode=m; selectedIdx=null;
  document.getElementById('b-par').classList.toggle('active',m==='par');
  document.getElementById('b-bogey').classList.toggle('active',m==='bogey');
  draw();
}

function toggleView(){
  if(typeof map.setBearing !== 'function'){
    toast('回転プラグインの読み込みに失敗しました');
    return;
  }
  rotated=!rotated;
  var btn=document.getElementById('b-view');
  btn.classList.toggle('active',rotated);
  btn.textContent=rotated?'通常表示':'プレーヤー目線';
  if(rotated) applyBearing(); else map.setBearing(0);
}
function applyBearing(){
  var pts=cur(); var b=bearing(pts[0],pts[pts.length-1]);
  map.setBearing(-b);
  map.setView(L.latLngBounds(pts).getCenter(), map.getZoom(), {animate:true});
}

// コンパス
function enableCompass(){
  if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(function(r){if(r==='granted')startCompass();else alert('方角センサーの許可が必要です');}).catch(function(){alert('方角機能が使えません');});
  } else if(typeof DeviceOrientationEvent!=='undefined'){startCompass();}
  else alert('この端末は方角センサー非対応です');
}
function startCompass(){
  document.getElementById('enable-compass').style.display='none';
  window.addEventListener('deviceorientationabsolute',onOrient,true);
  window.addEventListener('deviceorientation',onOrient,true);
}
function onOrient(e){
  var h=null;
  if(e.webkitCompassHeading!=null)h=e.webkitCompassHeading;
  else if(e.absolute&&e.alpha!=null)h=360-e.alpha;
  if(h==null)return;
  var pts=cur(); var gb=bearing(pts[0],pts[pts.length-1]);
  var diff=((gb-h)+360)%360;
  document.getElementById('compass-needle').style.transform='translate(-50%, -100%) rotate('+diff+'deg)';
  var txt;
  if(diff<10||diff>350)txt='<b>グリーン正面</b>';
  else if(diff<=180)txt='<b>あと'+Math.round(diff)+'°</b><br>右へ';
  else txt='<b>あと'+Math.round(360-diff)+'°</b><br>左へ';
  document.getElementById('compass-txt').innerHTML=txt;
}

// GPS
function toggleGPS(){
  var btn=document.getElementById('b-gps');
  if(gpsWatchId!==null){
    navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;
    if(gpsMarker){map.removeLayer(gpsMarker);gpsMarker=null;}
    if(gpsAccuracy){map.removeLayer(gpsAccuracy);gpsAccuracy=null;}
    btn.classList.remove('active'); gpsActive=false; draw(); return;
  }
  if(!navigator.geolocation){alert('位置情報が使えません');return;}
  btn.classList.add('active'); gpsActive=true;
  gpsWatchId=navigator.geolocation.watchPosition(function(pos){
    var ll=[pos.coords.latitude,pos.coords.longitude],acc=pos.coords.accuracy;
    if(!gpsMarker){
      gpsMarker=L.circleMarker(ll,{radius:9,color:'#fff',weight:3,fillColor:'#378ADD',fillOpacity:1}).addTo(map);
      gpsAccuracy=L.circle(ll,{radius:acc,color:'#378ADD',weight:1,fillColor:'#378ADD',fillOpacity:0.1}).addTo(map);
    } else { gpsMarker.setLatLng(ll); gpsAccuracy.setLatLng(ll).setRadius(acc); }
    window._lastGps = ll;
    updateGpsDistance();
  }, function(){alert('位置情報を取得できませんでした');btn.classList.remove('active');gpsWatchId=null;},
  {enableHighAccuracy:true,maximumAge:2000,timeout:10000});
}

function updateGpsDistance(){
  if(!window._lastGps) return;
  var green=cur()[cur().length-1];
  document.getElementById('total-text').textContent=toDisplay(dist(window._lastGps,green));
}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2000);
}

draw();
map.fitBounds(L.latLngBounds(cur()),{padding:[70,70]});
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
</script>
